services:
  - type: web
    name: devna-public-mcp
    runtime: python
    plan: starter
    branch: feature/devna-core-runtime
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DEVNA_ALLOWED_API_HOSTS
        value: api.github.com,api.frankfurter.app
